name: Akcie v halách (PWA)

on:
  schedule:
    - cron: "17 */3 * * *"   # každé 3 hodiny
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "arena-akce/**"
      - ".github/workflows/arena-akce.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stiahnuť program akcií
        run: python3 arena-akce/scraper/scrape.py arena-akce/app/events.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: arena-akce/app
      - id: deployment
        uses: actions/deploy-pages@v4
